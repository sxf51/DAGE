name: python-wheels

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - "examples/python/service_host.py"
      - "include/**"
      - "src/**"
      - "tests/conformance/bindings/**"
      - "tools/python_wheel_audit.py"
      - "CMakeLists.txt"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install wheel builder
        run: python -m pip install cibuildwheel==2.23.3
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config jsoncpp openssl@3 zlib
      - name: Build macOS native runtime
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-python-wheel -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DDAGE_BUILD_SHARED=ON -DDAGE_BUILD_TESTS=OFF -DDAGE_BUILD_TOOLS=OFF \
            -DDAGE_BUILD_EXAMPLES=OFF -DDAGE_BUILD_BUNDLE_TOOLS=OFF \
            -DDAGE_BUILD_OPENTELEMETRY_BRIDGE=OFF
          cmake --build build-python-wheel --target dage
          mapfile -t runtime_dependencies < <(ldd build-python-wheel/libdage.dll | awk '$2 == "=>" && $3 ~ /\/ucrt64\/bin\// { print $3 }' | sort -u)
          test "${#runtime_dependencies[@]}" -gt 0
          wheel_libraries=("$(cygpath -w "$PWD/build-python-wheel/libdage.dll")")
          for dependency in "${runtime_dependencies[@]}"; do
            wheel_libraries+=("$(cygpath -w "$dependency")")
          done
          (IFS=';'; echo "DAGE_WHEEL_LIBRARIES=${wheel_libraries[*]}") >> "$GITHUB_ENV"
          echo "DAGE_WHEEL_LIBRARIES=$PWD/build-python-wheel/libdage.dylib" >> "$GITHUB_ENV"
      - name: Build repaired CPython 3.11-3.13 wheels
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_ARCHS: native
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_LINUX: >-
            DAGE_WHEEL_LIBRARIES=/tmp/dage-wheel/libdage.so
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y cmake ninja-build pkgconf-pkg-config jsoncpp-devel openssl-devel zlib-devel &&
            cmake -S /project -B /tmp/dage-wheel -G Ninja -DCMAKE_BUILD_TYPE=Release
            -DDAGE_BUILD_SHARED=ON -DDAGE_BUILD_TESTS=OFF -DDAGE_BUILD_TOOLS=OFF
            -DDAGE_BUILD_EXAMPLES=OFF -DDAGE_BUILD_BUNDLE_TOOLS=OFF
            -DDAGE_BUILD_OPENTELEMETRY_BRIDGE=OFF &&
            cmake --build /tmp/dage-wheel --target dage
          CIBW_TEST_COMMAND: >-
            python {project}/bindings/python/conformance.py &&
            python {project}/examples/python/service_host.py
        run: python -m cibuildwheel bindings/python --output-dir wheelhouse
      - name: Audit wheel structure and RECORD
        run: for wheel in wheelhouse/*.whl; do python tools/python_wheel_audit.py "$wheel"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheels-${{ matrix.os }}-unsigned
          path: wheelhouse/

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-jsoncpp
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build native runtime
        shell: msys2 {0}
        run: |
          cmake -S . -B build-python-wheel -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDAGE_BUILD_SHARED=ON -DDAGE_BUILD_TESTS=OFF -DDAGE_BUILD_TOOLS=OFF \
            -DDAGE_BUILD_EXAMPLES=OFF -DDAGE_BUILD_BUNDLE_TOOLS=OFF \
            -DDAGE_BUILD_OPENTELEMETRY_BRIDGE=OFF
          cmake --build build-python-wheel --target dage
      - name: Build repaired CPython 3.11-3.13 wheels
        shell: pwsh
        env:
          CIBW_BUILD: "cp311-win_amd64 cp312-win_amd64 cp313-win_amd64"
          CIBW_ARCHS: AMD64
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: >-
            python {project}/bindings/python/conformance.py &&
            python {project}/examples/python/service_host.py
        run: |
          python -m pip install cibuildwheel==2.23.3
          python -m cibuildwheel bindings/python --output-dir wheelhouse
      - name: Audit wheel structure and RECORD
        shell: pwsh
        run: Get-ChildItem wheelhouse\*.whl | ForEach-Object { python tools\python_wheel_audit.py $_.FullName }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheels-windows-x64-unsigned
          path: wheelhouse/
